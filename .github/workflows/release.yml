name: Release

# Tags main's version and publishes it, once main has been quiet long enough
# that the release carries a batch rather than a single pull request.
#
# The clock is a debounce, not a cooldown: every merge restarts it, so a busy
# afternoon produces one release when the afternoon ends. Nothing is ever left
# behind -- the window closing is itself the trigger, so a pending version
# ships as soon as things go quiet, with nobody deciding anything.
#
# Run it by hand from the Actions tab (or `gh workflow run release.yml`) to
# flush whatever is pending immediately. That skips the wait and nothing else:
# the version still has to be past the latest tag, because it is the tag that
# says what has already been published.

on:
  schedule:
    - cron: '0 * * * *' # hourly; the window below is what actually paces it
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch publish.yml (gh workflow run / gh run watch)

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # need the full tag history to find the latest one

      - name: Tag main's version, once it is past the tag and main has settled
        id: tag
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          . ./scripts/publish-impact.sh

          PKG_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "main: $PKG_VERSION, latest tag: ${LATEST_TAG:-(none)}"

          # Ahead, not merely different: a main behind the latest tag must not
          # tag backwards and publish an old tree over a newer release.
          if ! version_is_ahead "$PKG_VERSION" "$LATEST_VERSION"; then
            echo "Nothing past ${LATEST_TAG:-the first release} to publish."
            exit 0
          fi

          LAST_MERGE=$(git log -1 --format=%ct main)
          NOW=$(date -u +%s)
          if [ "$MANUAL" != 'true' ] && ! release_window_elapsed "$LAST_MERGE" "$NOW"; then
            echo "$PKG_VERSION is pending, but main moved $(( (NOW - LAST_MERGE) / 60 ))m ago -- still inside the ${RELEASE_WINDOW_HOURS}h window. Waiting for more to batch with it."
            exit 0
          fi

          TAG="v$PKG_VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
          git push origin "$TAG"

      # Deliberately not a plain tag push triggering publish.yml's own
      # `push: tags` listener: a tag pushed with the default GITHUB_TOKEN
      # doesn't trigger other workflows (GitHub's own loop-prevention).
      # workflow_dispatch is the proven path -- both a human's manual
      # `gh workflow run` and this job use it identically.
      - name: Trigger the real publish, and wait for it to actually succeed
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          BEFORE=$(gh run list --workflow=publish.yml --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run publish.yml --ref "$TAG"

          RUN_ID=""
          for i in $(seq 1 20); do
            sleep 5
            RUN_ID=$(gh run list --workflow=publish.yml --json databaseId,event,headBranch \
              --jq "[.[] | select(.event == \"workflow_dispatch\" and .headBranch == \"$TAG\" and .databaseId > $BEFORE)][0].databaseId // empty")
            if [ -n "$RUN_ID" ]; then break; fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not find the triggered publish run for $TAG" >&2
            exit 1
          fi
          echo "Watching publish run $RUN_ID for $TAG"
          gh run watch "$RUN_ID" --exit-status
