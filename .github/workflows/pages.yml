name: demo-pages

# Publishes the browser demo (issues #199, #239) to GitHub Pages: the map stack
# from public/ against the saved NOAA snapshot in demo/, and -- on ?live -- the
# plugin's own compiled product modules fetching NOAA from the visitor's
# browser. Assembled by scripts/build-demo.mjs. Requires Pages to be set to
# "GitHub Actions" in the repo settings, once.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'public/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'scripts/build-demo.mjs'
      - 'scripts/sync-coastline.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm ci's prepare step vendors the coastline into public/. Unchanged on
      # purpose: the plugin registry scores this package by running `npm ci`
      # offline under a 60-second cap, so nothing may be added to the root
      # install to serve this workflow.
      - run: npm ci
      # The demo's live data layer is the compiled plugin, loaded unbundled --
      # `tsc` emits ES modules a browser resolves as they are, and this package
      # has no runtime dependencies to bundle. So dist/ has to exist before the
      # demo can be assembled, and typescript is already a devDependency here.
      - run: npm run build
      - run: node scripts/build-demo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist
      - id: deployment
        uses: actions/deploy-pages@v4
