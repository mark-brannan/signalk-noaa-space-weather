name: Version guard

# The last check before a change is stranded: main carries something that
# ships, at a version already tagged, so no release can ever carry it.
#
# version-gate.yml should have caught this on the pull request. This job
# exists because a gate nothing requires can be merged past, and a failure
# here is loud where a silent exit 0 was how #123 went unnoticed.
#
# Tagging and publishing happen in release.yml, on a timer -- not here. A
# merge no longer publishes; it starts the release window over.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the full tag history to find the latest one

      - name: Refuse to leave a publish-impacting change unreleasable
        run: |
          . ./scripts/publish-impact.sh

          PKG_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          LATEST_VERSION="${LATEST_TAG#v}"

          if version_is_ahead "$PKG_VERSION" "$LATEST_VERSION"; then
            echo "main is at $PKG_VERSION, pending release past ${LATEST_TAG:-the first release}."
            exit 0
          fi

          CHANGED=$(git diff --name-only --no-renames "$LATEST_TAG"..HEAD)
          if [ -z "$CHANGED" ] || ! echo "$CHANGED" | publish_impacting; then
            echo "Nothing on main past ${LATEST_TAG:-the first release} reaches the tarball."
            exit 0
          fi

          NEXT=$(next_patch_version "$PKG_VERSION" "$LATEST_VERSION")
          echo "::error::main ships changes past ${LATEST_TAG:-the first release} at $PKG_VERSION, which is already tagged, so nothing can publish them. Merge a branch with npm version $NEXT -- and check the version gate is required on the ruleset, because it should have caught this."
          echo "$CHANGED" | grep -vE "$NO_PUBLISH_IMPACT" | sed 's/^/  /'
          exit 1
