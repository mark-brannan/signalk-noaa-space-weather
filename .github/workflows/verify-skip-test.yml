name: Verify Skip Test

# Throwaway workflow to verify that GitHub treats a required job skipped via
# `if:` as satisfying a required-status-check ruleset. Deleted once the test
# PR is closed. See kanban / CI cost investigation.

on:
  pull_request:

jobs:
  verify-skip-required:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "should never run"
